name: Standalone SQLite CI

on:
  push:
    branches: [melhorias-seguranca-filas]
    paths:
      - 'standalone/**'
      - 'internal/queueengine/**'
      - '.github/workflows/standalone-ci.yml'
  pull_request:
    paths:
      - 'standalone/**'
      - 'internal/queueengine/**'
      - '.github/workflows/standalone-ci.yml'

jobs:
  standalone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install SQLite build requirements
        run: sudo apt-get update && sudo apt-get install -y gcc libsqlite3-dev
      - name: Resolve standalone module dependencies
        working-directory: standalone
        run: go mod tidy
      - name: Build standalone CLI
        working-directory: standalone
        env:
          CGO_ENABLED: '1'
        run: go build -o queue-standalone .
      - name: Test persistence, leases and concurrency
        working-directory: standalone
        env:
          CGO_ENABLED: '1'
        run: go test -race -count=1 -v ./...
