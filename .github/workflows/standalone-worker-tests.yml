name: Standalone worker tests

on:
  workflow_dispatch:
  push:
    branches: [melhorias-seguranca-filas]
  pull_request:
    paths:
      - 'standalone/**'
      - 'internal/queueengine/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/standalone-worker-tests.yml'

jobs:
  standalone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: standalone/go.mod
          cache: false
      - name: Compile standalone executable
        working-directory: standalone
        run: go build -mod=mod -o /tmp/queue-standalone .
      - name: Check standalone code with go vet
        working-directory: standalone
        run: go vet -mod=mod ./...
      - name: Run standalone tests with race detection
        working-directory: standalone
        run: go test -mod=mod -race -count=1 ./...
