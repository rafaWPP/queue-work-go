name: Go CI

on:
  push:
    branches: [main, versao-completa, melhorias-seguranca-filas]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l main.go web/auth_test.go)
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi
      - name: Unit tests
        run: go test ./...
      - name: Compile packages
        run: go build ./...
